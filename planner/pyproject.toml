[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planner-agent"
version = "0.1.0"
description = "Biomedical query planner agent scaffolding for drug repurposing"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "plan-core>=0.1,<0.2"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
