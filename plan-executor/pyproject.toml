[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-executor"
version = "0.1.0"
description = "Executes biomedical query plans against the ARAX knowledge graph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # The plan contract: schema, Biolink model, shared validators. A hard
    # dependency — an unvalidated plan can reach ARAX with a misspelled
    # predicate, return nothing, and look identical to a genuine absence of
    # data. Install editable from a sibling checkout while both are moving:
    #     pip install -e ../plan-core
    # The *package* version, which is 0.1.x. This used to read >=0.10,<0.11,
    # which is the *plan schema* version the plans carry in `plan_version`.
    # Two different numbers that both look like a version of plan-core. The
    # mistake never surfaced because everything was run from PYTHONPATH, where
    # no version is checked; a clean `pip install -e` could not resolve it.
    "plan-core>=0.1,<0.2",

    "requests>=2.28",   # ARAX, name resolution, Ollama
    "httpx>=0.24",      # publication metadata service, which is async-only
]

[project.scripts]
plan-executor = "plan_executor.run_plan:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

# Tests here run without network or an LLM: `EntityResolver` takes a
# `mock_lookup` in place of the Name Resolver and any object with a
# `choose()` in place of the model, so resolution logic is testable on its
# own. plan-core must be importable — editable install, or
#     PYTHONPATH=../plan-core/src python -m pytest
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
